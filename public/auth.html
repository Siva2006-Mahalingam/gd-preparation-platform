<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GD Preparation Platform — Practice group discussions with peers and receive individual AI-powered feedback.">
  <title>GD Platform — Sign In / Create Account</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container fade-in">

      <div class="auth-header">
        <div class="auth-logo">GD</div>
        <h1>GD Preparation Platform</h1>
        <p>Practice group discussions and get personalised feedback.</p>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" id="loginTab">Sign In</button>
          <button class="auth-tab" id="registerTab">Create Account</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email address</label>
            <input type="email" id="loginEmail" class="form-input"
              placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-input"
              placeholder="Enter your password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">Sign In</button>
        </form>

        <!-- Register Form -->
        <form class="auth-form" id="registerForm">
          <div class="form-group">
            <label class="form-label" for="registerUsername">Username</label>
            <input type="text" id="registerUsername" class="form-input"
              placeholder="Choose a username" required minlength="3" autocomplete="username">
          </div>
          <div class="form-group">
            <label class="form-label" for="registerEmail">Email address</label>
            <input type="email" id="registerEmail" class="form-input"
              placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="registerPassword">Password</label>
            <input type="password" id="registerPassword" class="form-input"
              placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">Create Account</button>
        </form>
      </div>

    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
